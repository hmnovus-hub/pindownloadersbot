services:
  - type: web
    name: social-media-downloader-bot
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: MAX_FILE_SIZE_MB
        value: "49"
      - key: MAX_CONCURRENT_DOWNLOADS
        value: "1"
      - key: WEBHOOK_PATH
        value: telegram/webhook
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: INSTAGRAM_COOKIES_FROM_BROWSER
        value: ""
      - key: INSTAGRAM_COOKIES_FILE
        value: /etc/secrets/instagram_cookies.txt

